[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kikit-packer"
dynamic = ["version"]
description = "Deterministic multi-board packing for KiKit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "KiKit>=1.8,<1.9",
  "rectangle-packer>=2,<3",
  "PyYAML>=6,<7",
  "Shapely>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=7,<9", "ruff==0.15.0"]
build = ["build>=1,<2"]

[project.scripts]
kikit-packer = "kikit_packer.cli:main"

[tool.setuptools.dynamic]
version = {attr = "kikit_packer.__version__"}

[tool.setuptools.packages.find]
include = ["kikit_packer*"]

[tool.setuptools.package-data]
kikit_packer = ["resources/*.kicad_pcb", "kikit_181_preset.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
